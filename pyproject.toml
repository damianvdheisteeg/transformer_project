[project]
name = "minigpt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "pyyaml",
    "wandb",
    ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
where = ["src/minigpt"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
]
