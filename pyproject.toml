[project]
name = "minigpt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "pyyaml",
    "wandb",
    ]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "ipykernel", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
where = ["src/minigpt"]